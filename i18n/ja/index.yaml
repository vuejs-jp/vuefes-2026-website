nuxtSiteConfig:
  name: "Vue Fes Japan 2026"
  description: >
    2026年10月24日（土）に開催される日本最大級のVue.jsカンファレンスです。国内外の著名スピーカーによるセッションの他、LT、ハンズオン、グッズ販売などのイベントも企画しています。ぜひ一緒にVue.jsを楽しみ、盛り上げていきましょう！
mainVisual:
  imageAlt: >
    Vue Fes Japan 2026のメインビジュアル。VueをイメージしたVのシルエットと、日の丸をイメージした丸のシルエットが横に並んでいる。色は深い抹茶のような色をしており、丸のシルエットには金色の墨流し模様が描かれている。
  webglAlt: >
    Vue Fes Japan 2026のメインビジュアルアニメーション。VueをイメージしたVのシルエットと、日本の日の丸をイメージした丸のシルエットが横に並んでおり、丸のシルエットには金色の墨流し模様が描かれている。墨が流れるアニメーションとともに一定時間で色が変化している。
logo:
  alt: >
    Vue Fes Japan 2026ロゴ。VueをイメージしたVのシルエットと、日本の日の丸をイメージした丸のシルエットが横に並んでいる。色はVue.jsのロゴに使われている2色の色から作られた深い抹茶のような色。
  shortAlt: Vue Fes Japan 2026ロゴ
