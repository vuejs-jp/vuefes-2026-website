  creativeWall:
    title: "クリエイティブウォール"
    location: "2F受付前"
    description: "Vue Fes Japan名物のクリエイティブウォールが今年も登場です。Vue.jsやVue Fes Japanに対する熱い想いをぜひ書き込んでください。いつも使っているOSSロゴと一緒に記念写真も撮影できます。"
    alt: "Vue Fes Japan 2024の会場に設置されたクリエイティブウォールの前で、OSSロゴを手に笑顔でポーズをとるスタッフたち。"
  sponsorBooth:
    title: "スポンサーブースシールラリー"
    location: "1Fスポンサーブース"
    description: "各スポンサーブースで配られるシールを10枚以上集めると、ハズレなしのくじ引きに参加できます。集めたシールの枚数に応じて最大2回まで挑戦可能です。豪華景品が当たるかも！？"
    alt: "Vue Fes Japan 2024のスポンサーブースを訪れ、展示物を見ながら楽しそうに交流する参加者たち。"
  freeDrink:
    title: "フリードリンク & スナック"
    location: "1F・2Fホワイエ"
    description: "セッションやイベントで集中した後に、コーヒーやお茶はいかがですか？　お菓子も無料でご用意しています。ちょっとリフレッシュしたくなったら気軽にお立ち寄りください。"
    alt: "Vue Fes Japan 2024のドリンク＆スナックコーナーで、来場者に飲み物やお菓子を提供するスタッフたち。テーブルの前で笑顔で並んでいる。"
  festival:
    title: "縁日コーナー"
    location: "1Fホワイエ"
    description: "お祭り縁日の雰囲気を味わえる縁日コーナーが登場。「輪投げ」「かたぬき」「落書きせんべい」などを体験すると、Vue Fes Japanオリジナルお菓子、または懐かしの駄菓子がもらえます。"
    alt: "色とりどりのヨーヨーや提灯、うちわなどが並ぶ、祭の雰囲気を演出した装飾コーナー。中央には「祭」と書かれた手ぬぐいが置かれている。"
  tattoo:
    title: "タトゥースペース"
    location: "2Fホワイエ"
    description: "腕や手足に特製タトゥーシールを貼り付けて、フェス気分を盛り上げましょう。Vue Fes Japanはもちろん、おなじみのVue.jsやNuxtなどのロゴマークをその場ですぐに付けられます。"
    alt: "Vue Fes Japan 2024のロゴやOSSのロゴがデザインされたタトゥーシールを腕に貼っている様子。"
