name: Sync Ticket

on:
  schedule:
    # UTC 16:00 => JST 01:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-ticket:
    name: Sync Ticket
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: "0.1.11"
          node-version: "24.14.0"
          cache: true
          run-install: false

      - name: Install deps
        run: vp install --frozen-lockfile

      - name: Refresh Peatix sales and sync attendee roles
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEATIX_API_ORIGIN: ${{ vars.PEATIX_API_ORIGIN }}
          PEATIX_EVENT_ID: ${{ vars.PEATIX_EVENT_ID }}
          PEATIX_API_SECRET: ${{ secrets.PEATIX_API_SECRET }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${CLOUDFLARE_DATABASE_ID:?CLOUDFLARE_DATABASE_ID is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${PEATIX_API_ORIGIN:?PEATIX_API_ORIGIN is required}"
          : "${PEATIX_EVENT_ID:?PEATIX_EVENT_ID is required}"
          : "${PEATIX_API_SECRET:?PEATIX_API_SECRET is required}"

          curl --fail-with-body --silent --show-error \
            "$PEATIX_API_ORIGIN/event/$PEATIX_EVENT_ID/list_sales?fresh=true" \
            --header "Authorization: Bearer $PEATIX_API_SECRET"
          node scripts/admin/sync-role/main.ts
