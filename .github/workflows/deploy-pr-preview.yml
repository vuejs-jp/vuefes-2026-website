name: Deploy PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  deploy:
    name: Deploy PR Preview to Netlify
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      NETLIFY_DEPLOY_ALIAS: deploy-preview-${{ github.event.pull_request.number }}
      NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || 'vuefes-2026' }}
    environment:
      name: dev
      url: ${{ format('https://{0}--{1}.netlify.app/2026/', env.NETLIFY_DEPLOY_ALIAS, env.NETLIFY_SITE_NAME) }}
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 10
    concurrency:
      group: deploy-pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@b5d848f5a62488f3d3d920f8aa6ac318a60c5f07 # v1
        with:
          version: "0.1.11"
          node-version: "24.14.0"
          cache: true
          run-install: false

      - name: Install deps
        run: vp install --frozen-lockfile

      - name: Build and Deploy Preview
        run: vp run deploy:preview
        env:
          APP_ENV: preview
          APP_ORIGIN: ${{ format('https://{0}--{1}.netlify.app', env.NETLIFY_DEPLOY_ALIAS, env.NETLIFY_SITE_NAME) }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          NUXT_BASE_PATH: /2026/
          NUXT_SITE_URL: ${{ format('https://{0}--{1}.netlify.app/', env.NETLIFY_DEPLOY_ALIAS, env.NETLIFY_SITE_NAME) }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS }}
          OAUTH_GITHUB_CLIENT_SECRET_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET || secrets.OAUTH_GOOGLE_CLIENT_SECRET_ID }}
          PEATIX_API_SECRET: ${{ secrets.PEATIX_API_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          OAUTH_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ vars.OAUTH_GOOGLE_CLIENT_ID }}
          PEATIX_API_ORIGIN: ${{ vars.PEATIX_API_ORIGIN }}
          PEATIX_EVENT_ID: ${{ vars.PEATIX_EVENT_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- netlify-pr-preview -->';
            const body = [
              marker,
              'PR preview has been deployed.',
              '',
              '${{ format('https://{0}--{1}.netlify.app/2026/', env.NETLIFY_DEPLOY_ALIAS, env.NETLIFY_SITE_NAME) }}',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
