name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# Prevent concurrent Terraform runs (R2 doesn't support state locking)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_netlify_team_slug: ${{ vars.NETLIFY_TEAM_SLUG || 'core-staff' }}
  TF_VAR_netlify_site_name: ${{ vars.NETLIFY_SITE_NAME || 'vuefes-2026' }}
  TF_VAR_d1_dev_database_id: ${{ vars.D1_DEV_DATABASE_ID }}
  TF_VAR_d1_prod_database_id: ${{ vars.D1_PROD_DATABASE_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
  R2_TFSTATE_ACCESS_KEY_ID: ${{ secrets.R2_TFSTATE_ACCESS_KEY_ID }}
  R2_TFSTATE_SECRET_ACCESS_KEY: ${{ secrets.R2_TFSTATE_SECRET_ACCESS_KEY }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@b5d848f5a62488f3d3d920f8aa6ac318a60c5f07 # v1
        with:
          version: "0.1.11"
          node-version: "24.14.0"
          cache: true
          run-install: false

      - name: Install deps
        run: vp install --frozen-lockfile

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.12"

      - name: Terraform Format Check
        run: vp run terraform:fmt:check
        continue-on-error: true

      - name: Terraform Validate
        run: vp run terraform:validate

      - name: Terraform Plan
        id: plan
        run: vp run terraform:plan:ci
        continue-on-error: true

      - name: Generate Plan Output
        id: plan_output
        if: steps.plan.outcome == 'success'
        run: |
          echo 'plan<<EOF' >> $GITHUB_OUTPUT
          vp run terraform:show-plan >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${{ steps.plan_output.outputs.plan }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@b5d848f5a62488f3d3d920f8aa6ac318a60c5f07 # v1
        with:
          version: "0.1.11"
          node-version: "24.14.0"
          cache: true
          run-install: false

      - name: Install deps
        run: vp install --frozen-lockfile

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.12"

      - name: Terraform Apply
        run: vp run terraform:apply:ci
