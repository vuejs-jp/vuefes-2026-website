name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# Prevent concurrent Terraform runs (R2 doesn't support state locking)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_netlify_team_slug: ${{ vars.NETLIFY_TEAM_SLUG }}
  TF_VAR_netlify_site_id: ${{ vars.NETLIFY_SITE_ID }}
  TF_VAR_d1_dev_database_id: ${{ vars.D1_DEV_DATABASE_ID }}
  TF_VAR_d1_prod_database_id: ${{ vars.D1_PROD_DATABASE_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - name: Generate backend config
        run: |
          cat > backend.conf <<EOF
          endpoints = {
            s3 = "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          access_key = "${{ secrets.R2_TFSTATE_ACCESS_KEY_ID }}"
          secret_key = "${{ secrets.R2_TFSTATE_SECRET_ACCESS_KEY }}"
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend.conf

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Generate Plan Output
        id: plan_output
        run: |
          echo 'plan<<EOF' >> $GITHUB_OUTPUT
          terraform show -no-color tfplan >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${{ steps.plan_output.outputs.plan }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.12"

      - name: Generate backend config
        run: |
          cat > backend.conf <<EOF
          endpoints = {
            s3 = "https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          access_key = "${{ secrets.R2_TFSTATE_ACCESS_KEY_ID }}"
          secret_key = "${{ secrets.R2_TFSTATE_SECRET_ACCESS_KEY }}"
          EOF

      - name: Terraform Init
        run: terraform init -backend-config=backend.conf

      - name: Terraform Apply
        run: terraform apply -auto-approve
